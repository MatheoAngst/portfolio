<style>
/* Layout: plein écran, carte en points à gauche, colonne de pilotage à droite (empilée sur mobile) */
:root{
  --paper:#ECEFEA; --panel:#F7F8F5; --ink:#15212A; --muted:#5B686D; --line:#D3D9D1;
  --grid:#C2CAC0; --grid-hi:#9FAA9C; --adh:#DD4F1C; --ps:#1D6B74; --halo:rgba(221,79,28,.18);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1418; --panel:#141C21; --ink:#E4EAE6; --muted:#8E9CA0; --line:#24313A;
  --grid:#2C3B43; --grid-hi:#435661; --adh:#FF7440; --ps:#52B9C2; --halo:rgba(255,116,64,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1418; --panel:#141C21; --ink:#E4EAE6; --muted:#8E9CA0; --line:#24313A;
  --grid:#2C3B43; --grid-hi:#435661; --adh:#FF7440; --ps:#52B9C2; --halo:rgba(255,116,64,.22); color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--adh);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%;min-height:560px}
.stage{position:relative;min-width:0;overflow:hidden;display:flex;flex-direction:column;padding:22px 0 0 28px}
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-right:28px;position:relative;z-index:2}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.2vw,54px);line-height:.95;letter-spacing:-.025em;margin:6px 0 0;text-wrap:balance}
h1 .w{display:inline-block}
h1 em{font-style:normal;color:var(--adh)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);padding-bottom:6px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.sw.a{background:var(--adh);box-shadow:0 0 0 3px var(--halo)}
.sw.p{background:var(--ps);width:8px;height:8px}

.mapwrap{position:relative;flex:1;min-height:0;touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.gdot{fill:var(--grid)}
.gdot.hi{fill:var(--grid-hi)}
.coast{vector-effect:non-scaling-stroke;fill:none;stroke:var(--grid-hi);stroke-width:1.2;stroke-linejoin:round;opacity:.55}
.pt{cursor:pointer}
.pt.P{fill:var(--ps)}
.pt.A{fill:var(--adh);stroke:var(--panel);stroke-width:1.4}
.pt.sel{stroke:var(--ink);stroke-width:2}
.ring{fill:none;stroke:var(--adh);pointer-events:none}
.inset-box{fill:var(--panel);stroke:var(--line)}
.inset-lbl{font-family:var(--f-mono);font-size:11px;fill:var(--muted);letter-spacing:.08em}
.city{font-family:var(--f-mono);font-size:11px;fill:var(--muted);pointer-events:none;letter-spacing:.04em}

.zoomctl{position:absolute;right:20px;bottom:20px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoomctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center}
.zoomctl button:hover{border-color:var(--ink)}
.scale{position:absolute;left:0;bottom:18px;font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;z-index:2}
.scale i{display:block;height:6px;border:1px solid var(--muted);border-top:0}

.tip{position:fixed;z-index:20;pointer-events:none;background:var(--ink);color:var(--paper);padding:8px 11px;border-radius:8px;font-size:12.5px;max-width:260px;opacity:0;transform:translate(-50%,calc(-100% - 12px))}
.tip b{display:block;font-weight:600;line-height:1.25}
.tip small{font-family:var(--f-mono);font-size:10.5px;opacity:.75;letter-spacing:.03em}

/* Panneau */
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.stat{padding:18px 16px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat .n{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat:nth-child(1) .n{color:var(--adh)}
.stat:nth-child(2) .n{color:var(--ps)}
.stat .l{font-size:12px;color:var(--muted)}
.controls{padding:16px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-radius:10px;padding:3px;position:relative}
.seg button{border:0;background:none;padding:8px 6px;border-radius:8px;cursor:pointer;font-size:13px;position:relative;z-index:1;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);background:var(--panel);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.row{display:flex;gap:8px}
.field{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid transparent;border-radius:10px;padding:0 11px}
.field:focus-within{border-color:var(--ink)}
.field svg{flex:none;opacity:.6}
.field input,.field select{border:0;background:none;outline:none;padding:9px 0;width:100%;min-width:0}
.field select{cursor:pointer}
.result{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted)}
.result b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.result button{border:0;background:none;color:var(--adh);cursor:pointer;padding:0;font-size:12.5px}

.depts{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.depts h3,.listhead{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 10px}
.bars{display:flex;align-items:flex-end;gap:4px;height:64px}
.bar{flex:1;min-width:0;border:0;padding:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;background:var(--grid-hi);border-radius:3px 3px 0 0;transform-origin:bottom}
.bar span{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.bar:hover i,.bar.on i{background:var(--adh)}
.bar.on span{color:var(--ink)}

.listwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.listhead{padding:14px 16px 0;margin:0 0 6px}
ul.list{list-style:none;margin:0;padding:0 8px 16px;overflow:auto;flex:1;min-height:0}
ul.list li button{width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px;cursor:pointer;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center}
ul.list li button:hover,ul.list li button.on{background:var(--paper)}
ul.list .nm{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.list .ct{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
ul.list .dp{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.empty{padding:20px 16px;color:var(--muted)}

.card{position:absolute;left:28px;bottom:20px;z-index:4;width:min(360px,calc(100% - 100px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;box-shadow:0 12px 32px -12px rgba(0,0,0,.25)}
.card .tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card h2{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;margin:6px 28px 4px 0;letter-spacing:-.01em;text-wrap:balance}
.card .mere{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0;font-size:13px}
.card dt{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.card dd{margin:0;min-width:0;overflow-wrap:anywhere}
.card a{color:var(--ps);text-underline-offset:2px}
.card .x{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:8px;border:0;background:var(--paper);cursor:pointer}
.copy{border:1px solid var(--line);background:none;border-radius:6px;font-size:11px;padding:1px 7px;margin-left:6px;cursor:pointer;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:12.5px}

@media (max-width:900px){
  .app{grid-template-columns:1fr;height:auto}
  .stage{padding:16px 16px 0;height:auto}
  .masthead{padding-right:0}
  .mapwrap{flex:none;aspect-ratio:1/1;max-height:78vh;width:100%;max-width:100%}
  .side{border-left:0;border-top:1px solid var(--line)}
  ul.list{max-height:420px}
  .card{left:8px;bottom:8px;width:calc(100% - 64px)}
  .scale{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

function inside(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const [xi,yi]=poly[i],[xj,yj]=poly[j];if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}

// ---------- grille de points (le territoire) ----------
const gridL=$('gridL'), STEP=14, gdots=[], bands=[];
const cx0=px(2.35), cy0=py(46.6);
for(let r=0, y=20; y<1040; y+=STEP*0.87, r++){
  for(let x=20+(r%2?STEP/2:0); x<1050; x+=STEP){
    if(polys.some(p=>inside(x,y,p))){
      const dist=Math.hypot(x-cx0,y-cy0), b=Math.floor(dist/45);
      if(!bands[b]) bands[b]=el('g',{},gridL);
      const d=el('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:2.4,class:'gdot'},bands[b]);
      gdots.push(d);
    }
  }
}

function insetXY(lo,la){return [INS.x+20+(lo-55.18)/0.7*(INS.w-40), INS.y+30+(la+20.84)/-0.58*(INS.h-45)];}

// ---------- points ----------
DATA.forEach((d,i)=>{
  d.i=i;
  const [X,Y] = d.y<0 ? insetXY(d.x,d.y) : [px(d.x),py(d.y)];
  d.X=X; d.Y=Y;
  d.city=(d.a.match(/\d{5}\s+([^,]+)/)||[,d.a.split(',').slice(-1)[0]])[1].trim();
  d.key=(d.n+' '+d.a+' '+d.r+' '+d.m).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  const c=el('circle',{cx:X.toFixed(1),cy:Y.toFixed(1),r:d.t==='A'?7:4.2,class:'pt '+d.t,tabindex:0,role:'button','aria-label':d.n},$(d.t==='A'?'ptsA':'ptsP'));
  c._d=d; d.c=c;
});

// ---------- vue / zoom ----------
const svg=$('map'), vb={...FULL};
function applyVB(){
  svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const k=Math.pow(vb.w/1060,0.8);
  const gr=(2.4*Math.pow(vb.w/1060,0.55)).toFixed(2); if(gr!==applyVB._gr){applyVB._gr=gr; for(const g of gdots) g.setAttribute('r',gr);}
  DATA.forEach(d=>d.c.setAttribute('r',((d.t==='A'?7:4.2)*k*(d.c._hov?1.6:1)).toFixed(2)));
  document.querySelectorAll('.city').forEach(t=>{ if(t.tagName==='text'){t.setAttribute('font-size',(11*vb.w/1060).toFixed(2));} });
  updateScale();
}
function zoomTo(x,y,w,dur=1){
  const tgt={x:x-w/2,y:y-w/2,w,h:w};
  gsap.to(vb,{...tgt,duration:reduce?0:dur,ease:'power3.inOut',onUpdate:applyVB});
}
function updateScale(){
  const r=svg.getBoundingClientRect(); if(!r.width)return;
  const unitsPerPx=Math.max(vb.w/r.width, vb.h/r.height);
  // 1° lat ≈ 111 km = 100 unités
  const kmPerPx=unitsPerPx*1.11;
  const nice=[10,20,50,100,200].find(n=>n/kmPerPx>=50)||200;
  $('scalebar').style.width=(nice/kmPerPx).toFixed(0)+'px'; $('scaletxt').textContent=nice+' km';
}
addEventListener('resize',updateScale);
$('zin').onclick=()=>zoomTo(vb.x+vb.w/2,vb.y+vb.h/2,Math.max(vb.w/1.8,60),.6);
$('zout').onclick=()=>zoomTo(vb.x+vb.w/2,vb.y+vb.h/2,Math.min(vb.w*1.8,1060),.6);
$('zreset').onclick=()=>{zoomTo(530,530,1060,.9);};

// molette + glisser
const wrap=$('mapwrap');
function svgPt(e){const r=svg.getBoundingClientRect();const s=Math.max(vb.w/r.width,vb.h/r.height);const ox=(r.width*s-vb.w)/2,oy=(r.height*s-vb.h)/2;return [vb.x-ox+(e.clientX-r.left)*s, vb.y-oy+(e.clientY-r.top)*s, s];}
wrap.addEventListener('wheel',e=>{e.preventDefault();gsap.killTweensOf(vb);const [mx,my]=svgPt(e);const f=Math.exp(e.deltaY*0.0015);const nw=Math.min(1060,Math.max(50,vb.w*f));const s=nw/vb.w;vb.x=mx-(mx-vb.x)*s;vb.y=my-(my-vb.y)*s;vb.w=vb.h=nw;applyVB();},{passive:false});
let drag=null;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.card,.zoomctl')||e.target.classList.contains('pt'))return;gsap.killTweensOf(vb);drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,s:svgPt(e)[2],moved:false};wrap.setPointerCapture(e.pointerId);});
wrap.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3){drag.moved=true;wrap.classList.add('drag');}vb.x=drag.vx-dx*drag.s;vb.y=drag.vy-dy*drag.s;applyVB();});
wrap.addEventListener('pointerup',()=>{drag=null;wrap.classList.remove('drag');});

// ---------- tooltip ----------
const tip=$('tip');
function showTip(d){const r=d.c.getBoundingClientRect();tip.innerHTML=`<b>${esc(d.n)}</b><small>${esc(d.city)} · ${d.t==='A'?'Adhérent':'Point service'}</small>`;tip.style.left=(r.left+r.width/2)+'px';tip.style.top=r.top+'px';gsap.to(tip,{opacity:1,duration:.15});}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
svg.addEventListener('pointerover',e=>{const d=e.target._d;if(!d)return;showTip(d);gsap.to(d.c,{scale:1.7,svgOrigin:`${d.X} ${d.Y}`,duration:.25,ease:'back.out(3)'});});
svg.addEventListener('pointerout',e=>{const d=e.target._d;if(!d)return;hideTip();gsap.to(d.c,{scale:1,svgOrigin:`${d.X} ${d.Y}`,duration:.3});});
svg.addEventListener('click',e=>{const d=e.target._d;if(d)select(d);});
svg.addEventListener('keydown',e=>{const d=e.target._d;if(d&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(d);}});

// ---------- sélection ----------
let current=null;
function pulse(d){
  const fx=$('fx'); const k=vb.w/1060;
  for(let i=0;i<3;i++){
    const r=el('circle',{cx:d.X,cy:d.Y,r:6*k,class:'ring','stroke-width':2*k},fx);
    gsap.fromTo(r,{attr:{r:6*k},opacity:.9},{attr:{r:60*k},opacity:0,duration:1.4,delay:i*.28,ease:'power2.out',onComplete:()=>r.remove()});
  }
}
function select(d){
  if(current) current.c.classList.remove('sel');
  current=d; d.c.classList.add('sel');
  d.c.parentNode.appendChild(d.c);
  const w=d.y<0?220:340;
  zoomTo(d.X,d.Y,w,1.1);
  setTimeout(()=>pulse(d), reduce?0:700);
  renderCard(d);
  document.querySelectorAll('#list button.on').forEach(b=>b.classList.remove('on'));
  const lb=document.querySelector(`#list button[data-i="${d.i}"]`); if(lb){lb.classList.add('on'); lb.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});}
}
function renderCard(d){
  const c=$('card');
  const site=d.s?`<a href="${esc(d.s)}" target="_blank" rel="noopener">${esc(d.s.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))}</a>`:'<span style="color:var(--muted)">—</span>';
  c.innerHTML=`<button class="x" id="cx" aria-label="Fermer">✕</button>
  <span class="tag"><i class="sw ${d.t==='A'?'a':'p'}"></i>${d.t==='A'?'Adhérent':'Point service'} · réf. ${esc(d.r)}</span>
  <h2>${esc(d.n)}</h2>
  ${d.m?`<p class="mere">Rattaché à <b>${esc(d.m)}</b></p>`:'<p class="mere">Siège adhérent</p>'}
  <dl>
    <dt>Adresse</dt><dd>${esc(d.a)}</dd>
    <dt>Tél.</dt><dd><span class="mono">${esc(d.p||'—')}</span>${d.p?'<button class="copy" id="cp">Copier</button>':''}</dd>
    <dt>Site</dt><dd>${site}</dd>
  </dl>`;
  const fresh=c.hidden; c.hidden=false;
  gsap.fromTo(c,{y:fresh?30:8,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'});
  gsap.from(c.querySelectorAll('h2,.mere,dl > *'),{y:8,opacity:0,stagger:.03,duration:.4,delay:.08,ease:'power2.out'});
  $('cx').onclick=closeCard;
  const cp=$('cp'); if(cp) cp.onclick=()=>{navigator.clipboard.writeText(d.p.trim()).then(()=>{cp.textContent='Copié';},()=>{const r=document.createRange();r.selectNodeContents(cp.previousElementSibling);getSelection().removeAllRanges();getSelection().addRange(r);});};
}
function closeCard(){const c=$('card');gsap.to(c,{y:20,opacity:0,duration:.25,onComplete:()=>{c.hidden=true;}});if(current){current.c.classList.remove('sel');current=null;}document.querySelectorAll('#list button.on').forEach(b=>b.classList.remove('on'));}

// ---------- filtres ----------
const state={type:'all',q:'',grp:'',dep:''};
const groups={}; DATA.forEach(d=>{if(d.m)groups[d.m]=(groups[d.m]||0)+1;});
Object.entries(groups).sort((a,b)=>b[1]-a[1]).forEach(([g,n])=>{const o=document.createElement('option');o.value=g;o.textContent=`${g} (${n})`;$('grp').appendChild(o);});
const depName={'85':'Vendée','11':'Aude','29':'Finistère','51':'Marne','22':'Côtes-d’Armor','49':'Maine-et-Loire','39':'Jura','25':'Doubs','35':'Ille-et-Vilaine','44':'Loire-Atl.','66':'Pyr.-Orient.','81':'Tarn','36':'Indre','47':'Lot-et-Gar.','62':'Pas-de-Calais','31':'Hte-Garonne','58':'Nièvre','79':'Deux-Sèvres','21':'Côte-d’Or','34':'Hérault'};

function match(d){
  if(state.type!=='all'&&d.t!==state.type)return false;
  if(state.grp&&d.m!==state.grp&&!(d.t==='A'&&d.n===state.grp))return false;
  if(state.dep&&d.d!==state.dep)return false;
  if(state.q){const q=state.q;if(!(d.key.includes(q)||d.d===q))return false;}
  return true;
}
let firstRun=true;
function apply(){
  const on=[],off=[];
  DATA.forEach(d=>(match(d)?on:off).push(d));
  if(!firstRun){
    gsap.to(off.map(d=>d.c),{opacity:.08,duration:.4,overwrite:'auto',ease:'power2.out'});
    gsap.to(on.map(d=>d.c),{opacity:1,duration:.5,overwrite:'auto',stagger:{each:Math.min(.003,.6/Math.max(on.length,1))}});
    off.forEach(d=>d.c.style.pointerEvents='none'); on.forEach(d=>d.c.style.pointerEvents='');
  }
  const cnt=$('cnt'); const o={v:+cnt.textContent};
  gsap.to(o,{v:on.length,duration:.5,ease:'power2.out',onUpdate:()=>cnt.textContent=Math.round(o.v)});
  $('clear').hidden=!(state.q||state.grp||state.dep||state.type!=='all');
  renderList(on); renderBars(on);
  if(!firstRun && (state.grp||state.dep) && on.length){
    const xs=on.map(d=>d.X),ys=on.map(d=>d.Y).filter((y,i)=>on[i].y>0);
    const xx=on.filter(d=>d.y>0).map(d=>d.X);
    if(xx.length){const x0=Math.min(...xx),x1=Math.max(...xx),y0=Math.min(...ys),y1=Math.max(...ys);zoomTo((x0+x1)/2,(y0+y1)/2,Math.min(1060,Math.max(260,(x1-x0)*1.5,(y1-y0)*1.5)),1);}
  }
  firstRun=false;
}
function renderList(on){
  const ul=$('list');
  if(!on.length){ul.innerHTML='<li class="empty">Aucun établissement ne correspond. Modifiez la recherche ou effacez les filtres.</li>';return;}
  const sorted=[...on].sort((a,b)=>(a.t===b.t?a.n.localeCompare(b.n,'fr'):a.t==='A'?-1:1));
  ul.innerHTML=sorted.map(d=>`<li><button data-i="${d.i}" class="${current===d?'on':''}"><i class="sw ${d.t==='A'?'a':'p'}"></i><span style="min-width:0"><span class="nm">${esc(d.n)}</span><span class="ct">${esc(d.city)}</span></span><span class="dp">${d.d}</span></button></li>`).join('');
}
$('list').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)select(DATA[+b.dataset.i]);});
$('list').addEventListener('mouseover',e=>{const b=e.target.closest('button[data-i]');if(!b)return;const d=DATA[+b.dataset.i];gsap.fromTo(d.c,{scale:2.4,svgOrigin:`${d.X} ${d.Y}`},{scale:1,duration:.6,ease:'elastic.out(1,.4)'});});

function renderBars(on){
  const counts={}; on.forEach(d=>counts[d.d]=(counts[d.d]||0)+1);
  let top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,12);
  if(state.dep&&!top.find(t=>t[0]===state.dep)) top.push([state.dep,counts[state.dep]||0]);
  const max=Math.max(1,...top.map(t=>t[1]));
  const box=$('bars');
  box.innerHTML=top.map(([dp,n])=>`<button class="bar ${state.dep===dp?'on':''}" data-d="${dp}" title="${depName[dp]||'Dép. '+dp} : ${n}"><i style="height:${(n/max*44).toFixed(1)}px"></i><span>${dp}</span></button>`).join('');
  gsap.from(box.querySelectorAll('.bar i'),{scaleY:0,duration:.6,stagger:.03,ease:'power3.out'});
}
$('bars').addEventListener('click',e=>{const b=e.target.closest('.bar');if(!b)return;state.dep=state.dep===b.dataset.d?'':b.dataset.d;apply();});

// segment
const seg=$('seg');
seg.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  seg.querySelectorAll('button').forEach((x,i)=>{x.setAttribute('aria-pressed',x===b);if(x===b)gsap.to('#thumb',{xPercent:i*100,duration:.45,ease:'power3.out'});});
  state.type=b.dataset.v;apply();});
let qt;$('q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');apply();},160);});
$('grp').addEventListener('change',e=>{state.grp=e.target.value;apply();});
$('clear').onclick=()=>{Object.assign(state,{type:'all',q:'',grp:'',dep:''});$('q').value='';$('grp').value='';seg.querySelector('button').click();zoomTo(530,530,1060,.9);};

if(!reduce){
  const tl=gsap.timeline({defaults:{ease:'power3.out'}});

    .from('#title .w',{yPercent:110,opacity:0,rotate:4,stagger:.07,duration:.8},'<.1')

    .from('#labels g',{opacity:0,duration:.6,stagger:.05},'<')
    .from('#inset',{opacity:0,y:20,duration:.6},'<');
  const P=[...DATA].sort((a,b)=>a.Y-b.Y);
  tl.from(P.filter(d=>d.t==='P').map(d=>d.c),{y:-40,opacity:0,duration:.7,ease:'bounce.out',stagger:{each:.004}},1.2)
    .from(P.filter(d=>d.t==='A').map(d=>d.c),{scale:0,opacity:0,duration:.6,ease:'back.out(4)',stagger:{each:.02},transformOrigin:'50% 50%'},'<1')
    .from('.stat',{y:16,opacity:0,stagger:.08,duration:.5},0.4)
    .from('.controls > *, .depts, .listwrap',{y:12,opacity:0,stagger:.06,duration:.5},0.6)
    .from('#list li',{x:-12,opacity:0,stagger:.012,duration:.35},1.0)
    .from('.zoomctl button',{scale:.6,opacity:0,stagger:.06,duration:.4,ease:'back.out(3)'},1.4);
  count('sA',nA,1.6); count('sP',nP,1.2); count('sD',nD,1.4);
  setTimeout(()=>{ if(gsap.ticker.frame<15){ tl.progress(1); $('sA').textContent=nA; $('sP').textContent=nP; $('sD').textContent=nD; } },1500);
  // filet de sécurité : si l'appareil gèle l'animation, tout s'affiche quand même
  setTimeout(()=>{ if(tl.progress()<1){ tl.progress(1); gsap.globalTimeline.getChildren(false,true,false).forEach(x=>x.progress(1)); } $('sA').textContent=nA; $('sP').textContent=nP; $('sD').textContent=nD; },4500);
  // respiration discrète des adhérents
  gsap.to('#ptsA',{opacity:.86,duration:1.6,repeat:-1,yoyo:true,ease:'sine.inOut',delay:4});
} else { $('sA').textContent=nA; $('sP').textContent=nP; $('sD').textContent=nD; }
</script>

</body></html>
